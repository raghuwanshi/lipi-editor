<div
  class="flex items-center justify-between px-3 py-1.5 border-b text-xs overflow-x-auto gap-2"
  [class]="editor.isDarkMode() ? 'bg-slate-800/50 border-slate-700/80' : 'bg-slate-50 border-slate-200'"
>
  <div class="flex items-center space-x-1 shrink-0">
    <!-- File Operations -->
    <button (click)="editor.newDocument()" title="New File" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
    </button>
    <button (click)="triggerFileInput()" title="Open File" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"/></svg>
    </button>
    <button (click)="editor.saveFile()" title="Save File" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
    </button>

    <div class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-1"></div>

    <!-- Undo / Redo -->
    <button (click)="editor.undo()" [disabled]="!editor.canUndo()" title="Undo (Ctrl+Z)" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 disabled:opacity-30">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
    </button>
    <button (click)="editor.redo()" [disabled]="!editor.canRedo()" title="Redo (Ctrl+Y)" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 disabled:opacity-30">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6"/></svg>
    </button>

    <div class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-1"></div>

    <!-- Search Button -->
    <button (click)="ui.openFindModal()" title="Find & Replace (Ctrl+F)" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </button>

    <div class="h-4 w-[1px] bg-slate-300 dark:bg-slate-700 mx-1"></div>

    <!-- Word Wrap Toggle -->
    <button
      (click)="editor.toggleWordWrap()"
      title="Toggle Word Wrap"
      class="px-2 py-1 rounded text-xs font-medium border flex items-center space-x-1"
      [class]="editor.wordWrap() ? 'bg-sky-500/10 border-sky-500/40 text-sky-600 dark:text-sky-400' : 'border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300'"
    >
      <span>Word Wrap</span>
    </button>

    <!-- Font Selectors -->
    <select
      name="font-family-name"
      readonly
      [ngModel]="editor.fontFamily()"
      (ngModelChange)="editor.setFontFamily($event)"
      class="px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-sky-500"
    >
      @for (font of fontOptions; track font.value) {
        <option [value]="font.value">{{ font.label }}</option>
      }
    </select>

    <select
      name="font-size-name"
      readonly
      [ngModel]="editor.fontSize()"
      (ngModelChange)="editor.setFontSize($event)"
      class="px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-sky-500"
    >
      @for (size of fontSizeOptions; track size) {
        <option [value]="size">{{ size }}px</option>
      }
    </select>
  </div>

  <!-- Quick Trigger Test Buttons & Caret Context Drawer Toggle -->
  <div class="flex items-center space-x-2 shrink-0">
    <button
      (click)="ui.openSnippetsModal()"
      class="px-2.5 py-1 text-xs font-medium rounded bg-sky-600 hover:bg-sky-500 text-white shadow-sm flex items-center space-x-1 transition-colors"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span>Snippet Rules</span>
    </button>

    @if (editor.enableCaretInspector()) {
      <button
        (click)="editor.toggleCaretInspector()"
        class="px-2 py-1 text-xs font-medium rounded border transition-colors flex items-center space-x-1"
        [class]="editor.showCaretInspector() ? 'bg-amber-500/10 border-amber-500/40 text-amber-600 dark:text-amber-400' : 'border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300'"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        <span>Caret Inspector</span>
      </button>
    }
  </div>
</div>
