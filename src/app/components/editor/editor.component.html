<!-- Line Numbers Gutter -->
@if (editor.showLineNumbers()) {
  <app-line-numbers />
}

<!-- Code / Text Editor Textarea -->
<div class="flex-1 h-full w-full min-w-0 min-h-0 relative overflow-hidden">
  <textarea
    name="text-area-name"
    autocomplete="off"
    #editorArea
    [value]="editor.text()"
    (input)="onEditorInput($event)"
    (keyup)="updateCaretPosition()"
    (click)="updateCaretPosition()"
    (select)="updateCaretPosition()"
    (scroll)="syncGutterScroll()"
    (contextmenu)="onContextMenu($event)"
    (keydown)="onKeyDown($event)"
    [placeholder]="'Start typing here... Try auto-snippets like :date:, :time:, :shrug:, :todo:'"
    class="w-full h-full p-2 bg-transparent resize-none outline-none font-mono leading-normal transition-colors"
    [class.whitespace-pre]="!editor.wordWrap()"
    [class.whitespace-pre-wrap]="editor.wordWrap()"
    [style.font-family]="editor.fontFamily()"
    [style.font-size.px]="editor.effectiveFontSize()"
    [style.line-height]="editor.lineHeight"
    spellcheck="false"
  ></textarea>

  <!-- Hidden Offscreen Layout Mirror for Measuring Word-Wrapped Lines -->
  <div
    #mirrorElement
    aria-hidden="true"
    class="absolute -top-[99999px] -left-[99999px] invisible pointer-events-none overflow-hidden select-none"
    style="white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word; box-sizing: border-box;"
  ></div>
</div>
