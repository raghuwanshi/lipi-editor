@if (ui.isFindModalOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs">
    <div
      class="w-96 rounded-xl shadow-2xl border p-4 text-xs animate-in fade-in zoom-in-95"
      [class]="editor.isDarkMode() ? 'bg-slate-800 border-slate-700 text-slate-200' : 'bg-white border-slate-200 text-slate-800'"
    >
      <div class="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
        <h3 class="font-bold text-sm">Find and Replace</h3>
        <button (click)="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block font-medium mb-1">Find text:</label>
          <input
            type="text"
            [(ngModel)]="findQuery"
            (ngModelChange)="onFindQueryChange()"
            placeholder="Enter word or phrase..."
            class="w-full px-2.5 py-1.5 rounded border border-slate-300 dark:border-slate-600 bg-transparent focus:outline-none focus:ring-1 focus:ring-sky-500"
          />
        </div>

        <div>
          <label class="block font-medium mb-1">Replace with:</label>
          <input
            type="text"
            [(ngModel)]="replaceQuery"
            placeholder="Enter replacement text..."
            class="w-full px-2.5 py-1.5 rounded border border-slate-300 dark:border-slate-600 bg-transparent focus:outline-none focus:ring-1 focus:ring-sky-500"
          />
        </div>

        <div class="flex items-center justify-between text-slate-400 text-[11px]">
          <span>Matches found: <strong class="text-sky-500">{{ findMatchesCount() }}</strong></span>
          <label class="flex items-center space-x-1 cursor-pointer">
            <input type="checkbox" [(ngModel)]="matchCase" (change)="onFindQueryChange()" class="rounded text-sky-500" />
            <span>Match Case</span>
          </label>
        </div>

        <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-200 dark:border-slate-700">
          <button
            (click)="findNext()"
            class="px-3 py-1.5 rounded border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700"
          >
            Find Next
          </button>
          <button
            (click)="replaceNext()"
            class="px-3 py-1.5 rounded bg-sky-600 hover:bg-sky-500 text-white font-medium"
          >
            Replace
          </button>
          <button
            (click)="replaceAll()"
            class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-medium"
          >
            Replace All
          </button>
        </div>
      </div>
    </div>
  </div>
}
